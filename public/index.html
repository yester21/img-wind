<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imgwind</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/brand/imgwind-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
(function () {
  function go(locale) {
    location.replace("/" + locale + "/");
  }
  function detect() {
    var locales = ["ko", "en", "ja", "zh", "zh-TW", "id", "th", "ru"];
    try {
      var m = document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=([^;]+)/);
      if (m) {
        var saved = decodeURIComponent(m[1]);
        if (locales.indexOf(saved) !== -1) return saved;
      }
      var langs = navigator.languages || [navigator.language || "ko"];
      for (var i = 0; i < langs.length; i++) {
        var tag = String(langs[i]).toLowerCase();
        if (tag === "zh-tw" || tag === "zh-hk" || tag === "zh-hant" || tag === "zh-hant-tw") return "zh-TW";
        var base = tag.split("-")[0];
        if (locales.indexOf(base) !== -1) return base;
      }
    } catch (e) { /* 폴백 아래 */ }
    return "ko";
  }
  go(detect());
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f;text-align:center;padding-top:20vh">
<p><a href="/ko/">한국어</a> · <a href="/en/">English</a> · <a href="/ja/">日本語</a> · <a href="/zh/">简体中文</a> · <a href="/zh-TW/">繁體中文</a> · <a href="/id/">Bahasa Indonesia</a> · <a href="/th/">ไทย</a> · <a href="/ru/">Русский</a></p>
<noscript><meta http-equiv="refresh" content="0;url=/ko/"></noscript>
</body>
</html>
