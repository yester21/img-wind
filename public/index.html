<script>
(function () {
  function go(locale) {
    location.replace("/" + locale);
  }
  function detect() {
    var locales = ["ko", "en", "ja", "zh", "zh-TW", "id", "th", "ru"];
    try {
      var m = document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=([^;]+)/);
      if (m) {
        var saved = decodeURIComponent(m[1]);
        if (locales.indexOf(saved) !== -1) return saved;
      }
      var langs = navigator.languages || [navigator.language || "ko"];
      for (var i = 0; i < langs.length; i++) {
        var tag = String(langs[i]).toLowerCase();
        if (tag === "zh-tw" || tag === "zh-hk" || tag === "zh-hant" || tag === "zh-hant-tw") return "zh-TW";
        var base = tag.split("-")[0];
        if (locales.indexOf(base) !== -1) return base;
      }
    } catch (e) { /* 폴백 아래 */ }
    return "ko";
  }
  go(detect());
})();
</script>
